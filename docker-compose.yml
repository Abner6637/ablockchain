version: '3.9'

services:
  node10:
    container_name: node10
    depends_on:
      - bootnode
    image: ablockchain:5.1.5
    networks:
      customnet1:
        ipv4_address: 172.29.0.10
    ports:
      - "33100:32000"
      - "26100:8545"
      - "22100:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26100
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa 
      --valaddress 0xb26406d6a75187d8a5635609d0fa393431d81655 --valaddress 0x6e3685ad792c752be8772aeb3451c7be91c32ff2 
      --peer /ip4/172.29.0.11/tcp/32000/p2p/16Uiu2HAmT613qmWJ3dXq6XV1h1TACXaHPAgvvnoke4CUxo2tRXda 
      --backend=true
  node11:
    container_name: node11
    depends_on:
      - bootnode
    image: ablockchain:5.1.5
    networks:
      customnet1:
        ipv4_address: 172.29.0.11
    ports:
      - "33101:32000"
      - "26101:8545"
      - "22101:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26101
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa 
      --valaddress 0xb26406d6a75187d8a5635609d0fa393431d81655 --valaddress 0x6e3685ad792c752be8772aeb3451c7be91c32ff2 
      --peer /ip4/172.29.0.10/tcp/32000/p2p/16Uiu2HAm43QqeC4aN5DS3Ma3kFMdQBFkxFxmgi5AQZXG9a5SiUMm 
      --backend=true

networks:
  customnet1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
