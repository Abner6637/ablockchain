version: '3.9'

services:
  node0:
    container_name: node0
    depends_on:
      - bootnode
    image: ablockchain:0.0.1
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --valaddress 0x2b7a68add97dbfed676f2879d51006300c80fc2c --valaddress 0x1b821827e3a57939ed1154646579a911dec0ab6f --valaddress 0x0e6d70b18deae0da2856ba95064bec4ee2ece33a --valaddress 0x3016cc6e352d5b41b74f53e2450f4204764a9a15 
      --peer /ip4/172.28.0.10/tcp/32000/p2p/16Uiu2HAmTGWUAQnyewK6j14RQZeTayjAhN1tgHw2g29RjY9n6e5C --peer /ip4/172.28.0.11/tcp/32000/p2p/16Uiu2HAm7FDssjPqfqCGkRm7BXFTZAMeinrYqKEeTVPgATJeCXJS --peer /ip4/172.28.0.12/tcp/32000/p2p/16Uiu2HAkzsDcpgzQmcykceCGuNggJKpuvUCw4DryWT93m7KVszB7 --peer /ip4/172.28.0.13/tcp/32000/p2p/16Uiu2HAkvCfWGbYEMufD4n4Rd5Wnm7KFxdothiDQt155zLZ9S6k4 
      --backend=true
