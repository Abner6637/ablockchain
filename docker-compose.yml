version: '3.9'

services:
  node10:
    container_name: node10
    depends_on:
      - bootnode
    image: ablockchain:5.0.5
    networks:
      customnet1:
        ipv4_address: 172.29.0.10
    ports:
      - "33100:32000"
      - "26100:8545"
      - "22100:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26100
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa 
      --valaddress 0x51a433d8f9054e2d7946e89f539104096cfefd17 --valaddress 0x53073641fe38e199692fd91e09ac5e708e431be3 
      --peer /ip4/172.29.0.11/tcp/32000/p2p/16Uiu2HAmHjhQtosPuBZvhS9vuoYf7nknzdCAf7p3tcN9V6pPv1u5 
      --backend=true
  node11:
    container_name: node11
    depends_on:
      - bootnode
    image: ablockchain:5.0.5
    networks:
      customnet1:
        ipv4_address: 172.29.0.11
    ports:
      - "33101:32000"
      - "26101:8545"
      - "22101:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26101
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa 
      --valaddress 0x51a433d8f9054e2d7946e89f539104096cfefd17 --valaddress 0x53073641fe38e199692fd91e09ac5e708e431be3 
      --peer /ip4/172.29.0.10/tcp/32000/p2p/16Uiu2HAm8HFR3HCWdRXwnCQQwoFhDJp2CDC9gCJTspZ3ATFfmuRi 
      --backend=true

networks:
  customnet1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
