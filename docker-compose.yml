version: '3.9'

services:
  node10:
    container_name: node10
    depends_on:
      - bootnode
    image: ablockchain:9.9.9
    networks:
      customnet1:
        ipv4_address: 172.29.0.10
    ports:
      - "33100:32000"
      - "26100:8545"
      - "22100:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26100
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa 
      --valaddress 0x4939d8b055d41d5c275d195eac9a1e52cdc47dd6 --valaddress 0x64afc63848018844f33c9dd1a94b43a903ff0b3f --valaddress 0x6b7ab31987c5b375d3617d89933966783e6e2a15 
      --peer /ip4/172.29.0.11/tcp/32000/p2p/16Uiu2HAmJcHKFgq157Nri8wh68mADM3Gigy8ET2d3V725AieNHej --peer /ip4/172.29.0.12/tcp/32000/p2p/16Uiu2HAmVeBS5sUZ8UDqgJ2feT6uNSnLUvhytTdy61zmWavLFAem 
      --backend=true
  node11:
    container_name: node11
    depends_on:
      - bootnode
    image: ablockchain:9.9.9
    networks:
      customnet1:
        ipv4_address: 172.29.0.11
    ports:
      - "33101:32000"
      - "26101:8545"
      - "22101:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26101
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa 
      --valaddress 0x4939d8b055d41d5c275d195eac9a1e52cdc47dd6 --valaddress 0x64afc63848018844f33c9dd1a94b43a903ff0b3f --valaddress 0x6b7ab31987c5b375d3617d89933966783e6e2a15 
      --peer /ip4/172.29.0.10/tcp/32000/p2p/16Uiu2HAm8yVSiFxb53eLkFepDs9ns3vHiEnmbWJzkSFbVZza6HCF --peer /ip4/172.29.0.12/tcp/32000/p2p/16Uiu2HAmVeBS5sUZ8UDqgJ2feT6uNSnLUvhytTdy61zmWavLFAem 
      --backend=true
  node12:
    container_name: node12
    depends_on:
      - bootnode
    image: ablockchain:9.9.9
    networks:
      customnet1:
        ipv4_address: 172.29.0.12
    ports:
      - "33102:32000"
      - "26102:8545"
      - "22102:5173"
    volumes:
      - ./key_store/nodekey2:/ablockchain/key_store/nodekey2
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26102
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey2 
      --consensus poa 
      --valaddress 0x4939d8b055d41d5c275d195eac9a1e52cdc47dd6 --valaddress 0x64afc63848018844f33c9dd1a94b43a903ff0b3f --valaddress 0x6b7ab31987c5b375d3617d89933966783e6e2a15 
      --peer /ip4/172.29.0.10/tcp/32000/p2p/16Uiu2HAm8yVSiFxb53eLkFepDs9ns3vHiEnmbWJzkSFbVZza6HCF --peer /ip4/172.29.0.11/tcp/32000/p2p/16Uiu2HAmJcHKFgq157Nri8wh68mADM3Gigy8ET2d3V725AieNHej 
      --backend=true

networks:
  customnet1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
