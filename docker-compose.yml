version: '3.9'

services:
  node0:
    container_name: node0
    depends_on:
      - bootnode
    image: ablockchain:0.1.0
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
      - "26000:26666"
      - "22000:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26000
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus pbft
      --valaddress 0xec245fb4dedeee71a30a4767b07d610694ed63ba --valaddress 0xe3a5cfa2289945d8b2c19fac27105c47e4d1179c --valaddress 0x7cbaa90d286f6369a9cc91655d4df386a20d53b5 --valaddress 0x480f2d3de04fe9dd9af095f4ebf6e7ffa3d009c4 
      --peer /ip4/172.28.0.10/tcp/32000/p2p/16Uiu2HAkuhwdvmx6K8fHzHmFHpJZFgyqbkQ4ExcpUdtHPnZFy4c2 --peer /ip4/172.28.0.11/tcp/32000/p2p/16Uiu2HAmEJtnCDkuxNc58jE1VFHUytSC6d9WVNYZTwaDVpGjae5G --peer /ip4/172.28.0.12/tcp/32000/p2p/16Uiu2HAm31HRtVAesCLmNbi3ELeRmhZapKXdqzB1NCimBzBmmoGR --peer /ip4/172.28.0.13/tcp/32000/p2p/16Uiu2HAm6Fn76yPyQfnzHpxYKvo6oNzsbTGsK5aJcJyADJrF7SJA 
