version: '3.9'

services:
  node10:
    container_name: node10
    depends_on:
      - bootnode
    image: ablockchain:1.1.3
    networks:
      customnet1:
        ipv4_address: 172.29.0.10
    ports:
      - "33100:32000"
      - "26100:8545"
      - "22100:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26100
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa
      --valaddress 0x96e350e7d0761bb98b7f3654cceec601eb8c4ca7 --valaddress 0x32d64f981aac07e4c9dde39e2af68a8d769da2e9 
      --peer /ip4/172.29.0.10/tcp/32000/p2p/16Uiu2HAkw3mLswDiTKMsovqWvAC2ovBXngtEXT7NQ472rgMY2kcE --peer /ip4/172.29.0.11/tcp/32000/p2p/16Uiu2HAmGcfUQJyfUJzqG1RuxedLNeujv8ayF1bP5fuLFwcspnp6 
      --backend=true
  node11:
    container_name: node11
    depends_on:
      - bootnode
    image: ablockchain:1.1.3
    networks:
      customnet1:
        ipv4_address: 172.29.0.11
    ports:
      - "33101:32000"
      - "26101:8545"
      - "22101:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26101
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa
      --valaddress 0x96e350e7d0761bb98b7f3654cceec601eb8c4ca7 --valaddress 0x32d64f981aac07e4c9dde39e2af68a8d769da2e9 
      --peer /ip4/172.29.0.10/tcp/32000/p2p/16Uiu2HAkw3mLswDiTKMsovqWvAC2ovBXngtEXT7NQ472rgMY2kcE --peer /ip4/172.29.0.11/tcp/32000/p2p/16Uiu2HAmGcfUQJyfUJzqG1RuxedLNeujv8ayF1bP5fuLFwcspnp6 
      --backend=true
networks:
  customnet1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
