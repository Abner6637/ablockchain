version: '3.9'

services:
  node0:
    container_name: node0
    depends_on:
      - bootnode
    image: ablockchain:0.0.5
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus hotstuff
      --valaddress 0x2c7acc3c0c4056e23a2b5bc52682345fae313f3b --valaddress 0x3efee5c12d9aba2a63509e28bac5d74471021c75 --valaddress 0xd6d1d97984c8854c1c803b8252e5f826bbe9d6b2 --valaddress 0xcf7557deda3287a051cf261920fbb54e4252262d 
      --peer /ip4/172.28.0.10/tcp/32000/p2p/16Uiu2HAm6pjb8EMwf5RF5Nc8HtQNHPKa4YZRKrZiP9FNRRwyHeLW --peer /ip4/172.28.0.11/tcp/32000/p2p/16Uiu2HAm6hrpfi1f6j9ccBvxpTpN7V47BMBfZerRWagVuxXSVtwB --peer /ip4/172.28.0.12/tcp/32000/p2p/16Uiu2HAky4mCwJJq8pPjqWkA154mdiUXqLh6zjs4oEiPfyMy2jAx --peer /ip4/172.28.0.13/tcp/32000/p2p/16Uiu2HAmTatnxayMWGMqcpT5d2Liq6hnhXNhxDCWNe2hPt6pwe9e 
      --backend=true
