version: '3.9'

services:
  node20:
    container_name: node20
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.10
    ports:
      - "33200:32000"
      - "26200:8545"
      - "22200:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26200
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa
      --valaddress 0x1adc900ef6be0b44002146889c516252f0109c66 --valaddress 0xb1395f4496a8150b6a8269a1cf5ccdc9cb221ecd --valaddress 0x49261e6d03cbbab70fafa747111f4684e0a1e6ac 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmEzihceovFJrKAQCf45kYWUqTgEQuen39WM1boDDbGned --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAkvzE2F6pUKx8X1RRwW52c6EUWtrJwYRQPLmLBmQtaT38d --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAkukBsWjyaNrEvpqvUu3z4xjnRJSxFHa2fPmAnhKLCi4My 
      --backend=true
  node21:
    container_name: node21
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.11
    ports:
      - "33201:32000"
      - "26201:8545"
      - "22201:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26201
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa
      --valaddress 0x1adc900ef6be0b44002146889c516252f0109c66 --valaddress 0xb1395f4496a8150b6a8269a1cf5ccdc9cb221ecd --valaddress 0x49261e6d03cbbab70fafa747111f4684e0a1e6ac 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmEzihceovFJrKAQCf45kYWUqTgEQuen39WM1boDDbGned --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAkvzE2F6pUKx8X1RRwW52c6EUWtrJwYRQPLmLBmQtaT38d --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAkukBsWjyaNrEvpqvUu3z4xjnRJSxFHa2fPmAnhKLCi4My 
      --backend=true
  node22:
    container_name: node22
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.12
    ports:
      - "33202:32000"
      - "26202:8545"
      - "22202:5173"
    volumes:
      - ./key_store/nodekey2:/ablockchain/key_store/nodekey2
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26202
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey2 
      --consensus poa
      --valaddress 0x1adc900ef6be0b44002146889c516252f0109c66 --valaddress 0xb1395f4496a8150b6a8269a1cf5ccdc9cb221ecd --valaddress 0x49261e6d03cbbab70fafa747111f4684e0a1e6ac 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmEzihceovFJrKAQCf45kYWUqTgEQuen39WM1boDDbGned --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAkvzE2F6pUKx8X1RRwW52c6EUWtrJwYRQPLmLBmQtaT38d --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAkukBsWjyaNrEvpqvUu3z4xjnRJSxFHa2fPmAnhKLCi4My 
      --backend=true
networks:
  customnet2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
