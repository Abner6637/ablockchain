version: '3.9'

services:
  node20:
    container_name: node20
    depends_on:
      - bootnode
    image: ablockchain:2.2.11
    networks:
      customnet2:
        ipv4_address: 172.30.0.10
    ports:
      - "33200:32000"
      - "26200:8545"
      - "22200:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26200
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa
      --valaddress 0xfe70bd830d0c70510ad007c0f5486f03b2ebf78e --valaddress 0x1c8b5f3ac44328e2c9b3734eeca6beb77013f0fc --valaddress 0x74f27764c16b02705c28e1f9f7bdc19e24b20660 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmBjnxnNz7csMH5MvLsVXQTjveEejsvEn1ifV2uR7qxiuZ --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmGgkLrHHcbcmdZd7HkcfTLqjNWt8ffsuiwKohRNFjEvWP --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm2NUXgyAXmNViZRnjkkdTBc6XtncFCi1hfdxRoSdVM8eS 
      --backend=true
  node21:
    container_name: node21
    depends_on:
      - bootnode
    image: ablockchain:2.2.11
    networks:
      customnet2:
        ipv4_address: 172.30.0.11
    ports:
      - "33201:32000"
      - "26201:8545"
      - "22201:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26201
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa
      --valaddress 0xfe70bd830d0c70510ad007c0f5486f03b2ebf78e --valaddress 0x1c8b5f3ac44328e2c9b3734eeca6beb77013f0fc --valaddress 0x74f27764c16b02705c28e1f9f7bdc19e24b20660 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmBjnxnNz7csMH5MvLsVXQTjveEejsvEn1ifV2uR7qxiuZ --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmGgkLrHHcbcmdZd7HkcfTLqjNWt8ffsuiwKohRNFjEvWP --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm2NUXgyAXmNViZRnjkkdTBc6XtncFCi1hfdxRoSdVM8eS 
      --backend=true
  node22:
    container_name: node22
    depends_on:
      - bootnode
    image: ablockchain:2.2.11
    networks:
      customnet2:
        ipv4_address: 172.30.0.12
    ports:
      - "33202:32000"
      - "26202:8545"
      - "22202:5173"
    volumes:
      - ./key_store/nodekey2:/ablockchain/key_store/nodekey2
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26202
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey2 
      --consensus poa
      --valaddress 0xfe70bd830d0c70510ad007c0f5486f03b2ebf78e --valaddress 0x1c8b5f3ac44328e2c9b3734eeca6beb77013f0fc --valaddress 0x74f27764c16b02705c28e1f9f7bdc19e24b20660 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmBjnxnNz7csMH5MvLsVXQTjveEejsvEn1ifV2uR7qxiuZ --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmGgkLrHHcbcmdZd7HkcfTLqjNWt8ffsuiwKohRNFjEvWP --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm2NUXgyAXmNViZRnjkkdTBc6XtncFCi1hfdxRoSdVM8eS 
      --backend=true
networks:
  customnet2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
