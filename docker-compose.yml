version: '3.9'

services:
  node20:
    container_name: node20
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.10
    ports:
      - "33200:32000"
      - "26200:8545"
      - "22200:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26200
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa
      --valaddress 0xa8c24892aa2440120a01911a979a17f3124ad729 --valaddress 0xc437f0c9037c8fb81179188f9429b20d5e3af021 --valaddress 0x9d29eb9645205a8a7ee8828e59b90e3911fb71e4 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmMvLtNeH6RqNrrUfKSsoZo9v22mSjM3nrsUo7dptofNHJ --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmMC1Umn8uf6KNMDJo95vbAbWpUT5WdN5ve29GfDqsDMKn --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAmF7xBYMM849EP4UdQXvWv2ZzxoVCvawu3RmmVucNZmEeA 
      --backend=true
  node21:
    container_name: node21
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.11
    ports:
      - "33201:32000"
      - "26201:8545"
      - "22201:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26201
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa
      --valaddress 0xa8c24892aa2440120a01911a979a17f3124ad729 --valaddress 0xc437f0c9037c8fb81179188f9429b20d5e3af021 --valaddress 0x9d29eb9645205a8a7ee8828e59b90e3911fb71e4 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmMvLtNeH6RqNrrUfKSsoZo9v22mSjM3nrsUo7dptofNHJ --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmMC1Umn8uf6KNMDJo95vbAbWpUT5WdN5ve29GfDqsDMKn --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAmF7xBYMM849EP4UdQXvWv2ZzxoVCvawu3RmmVucNZmEeA 
      --backend=true
  node22:
    container_name: node22
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.12
    ports:
      - "33202:32000"
      - "26202:8545"
      - "22202:5173"
    volumes:
      - ./key_store/nodekey2:/ablockchain/key_store/nodekey2
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26202
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey2 
      --consensus poa
      --valaddress 0xa8c24892aa2440120a01911a979a17f3124ad729 --valaddress 0xc437f0c9037c8fb81179188f9429b20d5e3af021 --valaddress 0x9d29eb9645205a8a7ee8828e59b90e3911fb71e4 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmMvLtNeH6RqNrrUfKSsoZo9v22mSjM3nrsUo7dptofNHJ --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmMC1Umn8uf6KNMDJo95vbAbWpUT5WdN5ve29GfDqsDMKn --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAmF7xBYMM849EP4UdQXvWv2ZzxoVCvawu3RmmVucNZmEeA 
      --backend=true
networks:
  customnet2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
