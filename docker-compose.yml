version: '3.9'

services:
  bootnode:
    container_name: bootnode
    image: ablockchain:0.0.4
    networks:
      customnet:
        ipv4_address: 172.28.0.127
    ports:
      - "33333:32000"
    volumes:
      - ./key_store/nodekeyboot:/ablockchain/key_store/nodekeyboot
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekeyboot
      --isboot true
      --backend=true
  node0:
    container_name: node0
    depends_on:
      - bootnode
    image: ablockchain:0.0.4
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      sh -c "sleep 1 && ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --valaddress 0x9dbc2952848b7f9bf2ca1246ea43b7eb20acbf87 --valaddress 0x5b3d2191f0d5978cf0f733d089ba4488e4bf59fa --valaddress 0xe0f5fc8faf30c9b9828937bc981d2c5d69c9f1bb --valaddress 0x694e1d48ccd06efd9ee5e25278542e0019086705 
      --bootnode /ip4/172.28.0.127/tcp/32000/p2p/16Uiu2HAm4wNSqDcrMqfgkDfdhfHPQUvFjo9iMxi4y1smSqStWbTa
      --backend=true"
  node1:
    container_name: node1
    depends_on:
      - bootnode
    image: ablockchain:0.0.4
    networks:
      customnet:
        ipv4_address: 172.28.0.11
    ports:
      - "33001:32000"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      sh -c "sleep 1 && ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --valaddress 0x9dbc2952848b7f9bf2ca1246ea43b7eb20acbf87 --valaddress 0x5b3d2191f0d5978cf0f733d089ba4488e4bf59fa --valaddress 0xe0f5fc8faf30c9b9828937bc981d2c5d69c9f1bb --valaddress 0x694e1d48ccd06efd9ee5e25278542e0019086705 
      --bootnode /ip4/172.28.0.127/tcp/32000/p2p/16Uiu2HAm4wNSqDcrMqfgkDfdhfHPQUvFjo9iMxi4y1smSqStWbTa
      --backend=true"
  node2:
    container_name: node2
    depends_on:
      - bootnode
    image: ablockchain:0.0.4
    networks:
      customnet:
        ipv4_address: 172.28.0.12
    ports:
      - "33002:32000"
    volumes:
      - ./key_store/nodekey2:/ablockchain/key_store/nodekey2
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      sh -c "sleep 1 && ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey2 
      --valaddress 0x9dbc2952848b7f9bf2ca1246ea43b7eb20acbf87 --valaddress 0x5b3d2191f0d5978cf0f733d089ba4488e4bf59fa --valaddress 0xe0f5fc8faf30c9b9828937bc981d2c5d69c9f1bb --valaddress 0x694e1d48ccd06efd9ee5e25278542e0019086705 
      --bootnode /ip4/172.28.0.127/tcp/32000/p2p/16Uiu2HAm4wNSqDcrMqfgkDfdhfHPQUvFjo9iMxi4y1smSqStWbTa
      --backend=true"
  node3:
    container_name: node3
    depends_on:
      - bootnode
    image: ablockchain:0.0.4
    networks:
      customnet:
        ipv4_address: 172.28.0.13
    ports:
      - "33003:32000"
    volumes:
      - ./key_store/nodekey3:/ablockchain/key_store/nodekey3
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      sh -c "sleep 1 && ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey3 
      --valaddress 0x9dbc2952848b7f9bf2ca1246ea43b7eb20acbf87 --valaddress 0x5b3d2191f0d5978cf0f733d089ba4488e4bf59fa --valaddress 0xe0f5fc8faf30c9b9828937bc981d2c5d69c9f1bb --valaddress 0x694e1d48ccd06efd9ee5e25278542e0019086705 
      --bootnode /ip4/172.28.0.127/tcp/32000/p2p/16Uiu2HAm4wNSqDcrMqfgkDfdhfHPQUvFjo9iMxi4y1smSqStWbTa
      --backend=true"
