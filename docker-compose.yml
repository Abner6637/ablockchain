version: '3.9'

services:
  node10:
    container_name: node10
    depends_on:
      - bootnode
    image: ablockchain:6.9.6
    networks:
      customnet1:
        ipv4_address: 172.29.0.10
    ports:
      - "33100:32000"
      - "26100:8545"
      - "22100:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26100
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa 
      --valaddress 0xf0bc2bb7f785ef72fc50f88fff0f8277994bd0d9 --valaddress 0x008a2d408f8751187e2c33c856cafe966b1a2571 
      --peer /ip4/172.29.0.11/tcp/32000/p2p/16Uiu2HAmA2fN9Pf1jrm7WEtDgUryDqB7FSh8HB9z6seQtLTRDL6N 
      --backend=true
  node11:
    container_name: node11
    depends_on:
      - bootnode
    image: ablockchain:6.9.6
    networks:
      customnet1:
        ipv4_address: 172.29.0.11
    ports:
      - "33101:32000"
      - "26101:8545"
      - "22101:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26101
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa 
      --valaddress 0xf0bc2bb7f785ef72fc50f88fff0f8277994bd0d9 --valaddress 0x008a2d408f8751187e2c33c856cafe966b1a2571 
      --peer /ip4/172.29.0.10/tcp/32000/p2p/16Uiu2HAkwLx2zy7nutRVPkkMghuaQ5vGJMpCVi5n1UarU3wiTM1T 
      --backend=true

networks:
  customnet1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
