version: '3.9'

services:
  bootnode:
    container_name: bootnode
    image: ablockchain:0.0.3
    networks:
      customnet:
        ipv4_address: 172.28.0.127
    ports:
      - "33333:32000"
    volumes:
      - ./key_store/nodekeyboot:/ablockchain/key_store/nodekeyboot
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekeyboot
      --isboot true
      --backend=true
  node0:
    container_name: node0
    depends_on:
      - bootnode
    image: ablockchain:0.0.3
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      sh -c "sleep 1 && ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --valaddress 0x32e1f3d366dd4ac86c659c93f66cd27a631dfcdf --valaddress 0x56974055891b07fb8ebbf10723f36152f6e7801b --valaddress 0x4016242442186ea4de614c04539d55cb5ae8a937 --valaddress 0xfbc424cacd3a04fa78067b37a519b4d85016fad5 
      --bootnode /ip4/172.28.0.127/tcp/32000/p2p/16Uiu2HAmP9PwtR9ZcvnrB9ZSwERxzw2vPbKcRjErRnce5nSfYbpi
      --backend=true"
  node1:
    container_name: node1
    depends_on:
      - bootnode
    image: ablockchain:0.0.3
    networks:
      customnet:
        ipv4_address: 172.28.0.11
    ports:
      - "33001:32000"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      sh -c "sleep 1 && ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --valaddress 0x32e1f3d366dd4ac86c659c93f66cd27a631dfcdf --valaddress 0x56974055891b07fb8ebbf10723f36152f6e7801b --valaddress 0x4016242442186ea4de614c04539d55cb5ae8a937 --valaddress 0xfbc424cacd3a04fa78067b37a519b4d85016fad5 
      --bootnode /ip4/172.28.0.127/tcp/32000/p2p/16Uiu2HAmP9PwtR9ZcvnrB9ZSwERxzw2vPbKcRjErRnce5nSfYbpi
      --backend=true"
  node2:
    container_name: node2
    depends_on:
      - bootnode
    image: ablockchain:0.0.3
    networks:
      customnet:
        ipv4_address: 172.28.0.12
    ports:
      - "33002:32000"
    volumes:
      - ./key_store/nodekey2:/ablockchain/key_store/nodekey2
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      sh -c "sleep 1 && ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey2 
      --valaddress 0x32e1f3d366dd4ac86c659c93f66cd27a631dfcdf --valaddress 0x56974055891b07fb8ebbf10723f36152f6e7801b --valaddress 0x4016242442186ea4de614c04539d55cb5ae8a937 --valaddress 0xfbc424cacd3a04fa78067b37a519b4d85016fad5 
      --bootnode /ip4/172.28.0.127/tcp/32000/p2p/16Uiu2HAmP9PwtR9ZcvnrB9ZSwERxzw2vPbKcRjErRnce5nSfYbpi
      --backend=true"
  node3:
    container_name: node3
    depends_on:
      - bootnode
    image: ablockchain:0.0.3
    networks:
      customnet:
        ipv4_address: 172.28.0.13
    ports:
      - "33003:32000"
    volumes:
      - ./key_store/nodekey3:/ablockchain/key_store/nodekey3
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      sh -c "sleep 1 && ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey3 
      --valaddress 0x32e1f3d366dd4ac86c659c93f66cd27a631dfcdf --valaddress 0x56974055891b07fb8ebbf10723f36152f6e7801b --valaddress 0x4016242442186ea4de614c04539d55cb5ae8a937 --valaddress 0xfbc424cacd3a04fa78067b37a519b4d85016fad5 
      --bootnode /ip4/172.28.0.127/tcp/32000/p2p/16Uiu2HAmP9PwtR9ZcvnrB9ZSwERxzw2vPbKcRjErRnce5nSfYbpi
      --backend=true"
networks:
