version: '3.9'

services:
  node20:
    container_name: node20
    depends_on:
      - bootnode
    image: ablockchain:2.2.10
    networks:
      customnet2:
        ipv4_address: 172.30.0.10
    ports:
      - "33200:32000"
      - "26200:8545"
      - "22200:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26200
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa
      --valaddress 0xd731cfdb8ae891f70927d0cb2018f30924a9b259 --valaddress 0xc98fb1211e1677dfd627984b117f81842b74944e --valaddress 0xb5b6b847abb3260d19aca79757d58add6b851df9 --valaddress 0x47da177f7583651ec093d68ff2a13b17f6851cb2 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmF1CwAkAUdNdbDyE9UJKxtDK3Hrrf8LcJfaQacfYKEuSd --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAm7aAKznbUCNcvTK9BPEoTgi9Jk4cm29JNeRwYtgimVFCQ --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAmTVzFNEzk8CZaWckvezorYn7yB66p5Ld6ap3hkcGMTCN4 --peer /ip4/172.30.0.13/tcp/32000/p2p/16Uiu2HAmENxgKstmAN16qdtN9ouJumakBmQ1khLiJ8U86vhhx5VS 
