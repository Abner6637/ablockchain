version: '3.9'

services:
  node20:
    container_name: node20
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.10
    ports:
      - "33200:32000"
      - "26200:8545"
      - "22200:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26200
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa
      --valaddress 0xdd9519d740639ddd562bf7b736be15e77def601d --valaddress 0xb7316a8ae5a1c5fcd95756fbfc090c9af1d191ac --valaddress 0x7557ec7cadb300c0929407f2e135ea4878b88cbe 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmQjS1ibDMrR8PPnAsVaHcKGfzbxYYoeGPDQpsc5rEBast --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmN7WPVAytKsaBwetEzQyFgvccxLqmkWAZpQgadB4iay2z --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm8ffdDwx1sGamH3YrvxykvrYJhrUHR78AwjprtCoufkxC 
      --backend=true
  node21:
    container_name: node21
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.11
    ports:
      - "33201:32000"
      - "26201:8545"
      - "22201:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26201
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa
      --valaddress 0xdd9519d740639ddd562bf7b736be15e77def601d --valaddress 0xb7316a8ae5a1c5fcd95756fbfc090c9af1d191ac --valaddress 0x7557ec7cadb300c0929407f2e135ea4878b88cbe 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmQjS1ibDMrR8PPnAsVaHcKGfzbxYYoeGPDQpsc5rEBast --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmN7WPVAytKsaBwetEzQyFgvccxLqmkWAZpQgadB4iay2z --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm8ffdDwx1sGamH3YrvxykvrYJhrUHR78AwjprtCoufkxC 
      --backend=true
  node22:
    container_name: node22
    depends_on:
      - bootnode
    image: ablockchain:2.2.3
    networks:
      customnet2:
        ipv4_address: 172.30.0.12
    ports:
      - "33202:32000"
      - "26202:8545"
      - "22202:5173"
    volumes:
      - ./key_store/nodekey2:/ablockchain/key_store/nodekey2
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26202
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey2 
      --consensus poa
      --valaddress 0xdd9519d740639ddd562bf7b736be15e77def601d --valaddress 0xb7316a8ae5a1c5fcd95756fbfc090c9af1d191ac --valaddress 0x7557ec7cadb300c0929407f2e135ea4878b88cbe 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAmQjS1ibDMrR8PPnAsVaHcKGfzbxYYoeGPDQpsc5rEBast --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmN7WPVAytKsaBwetEzQyFgvccxLqmkWAZpQgadB4iay2z --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm8ffdDwx1sGamH3YrvxykvrYJhrUHR78AwjprtCoufkxC 
      --backend=true
networks:
  customnet2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
