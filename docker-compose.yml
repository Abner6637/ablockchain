version: '3.9'

services:
  node0:
    container_name: node0
    depends_on:
      - bootnode
    image: ablockchain:0.1.0
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
      - "26000:26666"
      - "22000:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26000
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus pbft
      --valaddress 0x75e19fb23c281052de5ffa85221056b7dfbc6508 --valaddress 0x5cfc21d28c7f440ad97ab1eedb78eef6ac179db3 --valaddress 0xaa1cdbd865aad2eb4fee66863735e9cff7b050cd --valaddress 0x62b68807ab573cfed47bb12a02fc9660fb6631e1 
      --peer /ip4/172.28.0.10/tcp/32000/p2p/16Uiu2HAkxNdP2Do38CB2d88SKYKVYAqqznoJ48yAbznQ3SffUhGn --peer /ip4/172.28.0.11/tcp/32000/p2p/16Uiu2HAmFjKY4cd6oANAZFkQckX2MuCm57wZKRGP1Byipf2CuTNT --peer /ip4/172.28.0.12/tcp/32000/p2p/16Uiu2HAmMdQJDF2a5zm3ekwyocjKek4BwT56bL2xxghmFKaBVrzH --peer /ip4/172.28.0.13/tcp/32000/p2p/16Uiu2HAmSv7xuhH76jMbKQqfNd5GHVQknQHUNARmYP7WW9Zn3wuB 
