version: '3.9'

services:
  node0:
    container_name: node0
    depends_on:
      - bootnode
    image: ablockchain:2.0.0
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
      - "26000:8545"
      - "22000:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26000
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus pbft
      --valaddress 0x021187c7caeaa8fa94dc94e701b7b4473615efab --valaddress 0x97fc47082654df8c3c85fbdcd3cb72ac03fa5e20 --valaddress 0x52642c13d6f8d595a611e2b402b5f1eae51fa770 --valaddress 0xf31008a6231aa138d54d7d49145ee870c4ce7e83 
      --peer /ip4/172.28.0.10/tcp/32000/p2p/16Uiu2HAm8FPt6hHJYyijwtYuZjS4AkFkHjZartgGEpg2NTwENPRV --peer /ip4/172.28.0.11/tcp/32000/p2p/16Uiu2HAmDJaWCTXFy1c9oGCUB3uK5qGC7ZMSRvn3Jk3XeZh7jHAy --peer /ip4/172.28.0.12/tcp/32000/p2p/16Uiu2HAmJanACBVd368KvirQxekYcQV9pswBQy19oL63yFLXKQjz --peer /ip4/172.28.0.13/tcp/32000/p2p/16Uiu2HAkx4VHiNouGepw3WSC3iTCQHfBacbssbpQZQRwAKTL7uTX 
