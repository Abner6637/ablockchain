version: '3.9'

services:
  node0:
    container_name: node0
    image: ablockchain:0.0.0
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --valaddress 0x8b4dfbf2790b9f0e22712b18cf9c6cf91141bfb6 --valaddress 0x1754c361b69fb63a4a0512cd1511e260eb379819 --valaddress 0xa464d98443c44cf4f0de9598e2c30ed903a0c55a --valaddress 0xaf55e5ba20c3c8d2d7e1645470365b0fdbaa9528 
      --backend=true

  node1:
    container_name: node1
    image: ablockchain:0.0.0
