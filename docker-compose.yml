version: '3.9'

services:
  node0:
    container_name: node0
    depends_on:
      - bootnode
    image: ablockchain:0.1.0
    networks:
      customnet:
        ipv4_address: 172.28.0.10
    ports:
      - "33000:32000"
      - "26000:26666"
      - "22000:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26000
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus hotstuff
      --valaddress 0x9344c6525f0ed6445d5033444c2f7f5da335e74b --valaddress 0x9794d50ae890cbe98e4962780bd4d6a2eac80d17 --valaddress 0x7f0217f0821578c7e75b204e42e6a1d495b9be45 --valaddress 0xf37f937afc0b713e35e4c2df445cdb7722829644 
      --peer /ip4/172.28.0.10/tcp/32000/p2p/16Uiu2HAkvWefUV1hEHsFFYgLfndLpi2NVuedQ3KxFUb56qQUxgLj --peer /ip4/172.28.0.11/tcp/32000/p2p/16Uiu2HAm4YuoUQ4scjKSNCYE1cQj1xXiijNsK7thRQFupWtdLVVq --peer /ip4/172.28.0.12/tcp/32000/p2p/16Uiu2HAmHhUDHvr25m9PdZfqswErw2k6mHdVMAS2GLhgJ51foNBU --peer /ip4/172.28.0.13/tcp/32000/p2p/16Uiu2HAkwLifdc62cvRE6WfHp3zT6jjmNHARiQaK4WEBo1d9TFGp 
