version: '3.9'

services:
  node20:
    container_name: node20
    depends_on:
      - bootnode
    image: ablockchain:2.2.8
    networks:
      customnet2:
        ipv4_address: 172.30.0.10
    ports:
      - "33200:32000"
      - "26200:8545"
      - "22200:5173"
    volumes:
      - ./key_store/nodekey0:/ablockchain/key_store/nodekey0
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26200
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey0 
      --consensus poa
      --valaddress 0xd1f0885f69dda850cf44862bee63c906599675b7 --valaddress 0xdedacec87080c05e873c1c1f9e34397670c4168a --valaddress 0x90d6260e9b1eae86d461c24f3a1a299d02e70442 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAm9orP1s7GHLtftJGrFzMzsVoqLpBhndjZrmAX7PV6ePrt --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmSSP4W5gqCCRbmvrC8aFA6r7KiD9se6nuPDE3JxbCuiMQ --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm3dK6NnGL3UyFhiwj1iMgKrb9QUzhJi6WtQBaG1bvGfcF 
      --backend=true
  node21:
    container_name: node21
    depends_on:
      - bootnode
    image: ablockchain:2.2.8
    networks:
      customnet2:
        ipv4_address: 172.30.0.11
    ports:
      - "33201:32000"
      - "26201:8545"
      - "22201:5173"
    volumes:
      - ./key_store/nodekey1:/ablockchain/key_store/nodekey1
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26201
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey1 
      --consensus poa
      --valaddress 0xd1f0885f69dda850cf44862bee63c906599675b7 --valaddress 0xdedacec87080c05e873c1c1f9e34397670c4168a --valaddress 0x90d6260e9b1eae86d461c24f3a1a299d02e70442 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAm9orP1s7GHLtftJGrFzMzsVoqLpBhndjZrmAX7PV6ePrt --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmSSP4W5gqCCRbmvrC8aFA6r7KiD9se6nuPDE3JxbCuiMQ --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm3dK6NnGL3UyFhiwj1iMgKrb9QUzhJi6WtQBaG1bvGfcF 
      --backend=true
  node22:
    container_name: node22
    depends_on:
      - bootnode
    image: ablockchain:2.2.8
    networks:
      customnet2:
        ipv4_address: 172.30.0.12
    ports:
      - "33202:32000"
      - "26202:8545"
      - "22202:5173"
    volumes:
      - ./key_store/nodekey2:/ablockchain/key_store/nodekey2
      - ./genesis.json:/ablockchain/genesis.json
    environment:
      - API_URL=http://192.168.2.127:26202
    command: >
      ./ablockchain 
      --listen /ip4/0.0.0.0/tcp/32000 
      --nodekey ./key_store/nodekey2 
      --consensus poa
      --valaddress 0xd1f0885f69dda850cf44862bee63c906599675b7 --valaddress 0xdedacec87080c05e873c1c1f9e34397670c4168a --valaddress 0x90d6260e9b1eae86d461c24f3a1a299d02e70442 
      --peer /ip4/172.30.0.10/tcp/32000/p2p/16Uiu2HAm9orP1s7GHLtftJGrFzMzsVoqLpBhndjZrmAX7PV6ePrt --peer /ip4/172.30.0.11/tcp/32000/p2p/16Uiu2HAmSSP4W5gqCCRbmvrC8aFA6r7KiD9se6nuPDE3JxbCuiMQ --peer /ip4/172.30.0.12/tcp/32000/p2p/16Uiu2HAm3dK6NnGL3UyFhiwj1iMgKrb9QUzhJi6WtQBaG1bvGfcF 
      --backend=true
networks:
  customnet2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
